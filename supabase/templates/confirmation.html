<!DOCTYPE html>
<!-- Copy this file into Supabase Dashboard → Authentication → Email Templates → Confirm signup -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm your email – Sports Pool</title>
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
        Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background-color: #f5f5f5; min-height: 100vh"
    >
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="max-width: 440px"
          >
            <tr>
              <td
                style="
                  background-color: #ffffff;
                  border: 1px solid #e5e7eb;
                  border-radius: 12px;
                  padding: 40px 32px;
                  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                "
              >
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td align="center" style="padding-bottom: 24px">
                      <span
                        style="
                          font-family: 'Oswald', sans-serif;
                          font-weight: 800;
                          font-size: 22px;
                          letter-spacing: 0.12em;
                          text-transform: uppercase;
                          color: #ffffff;
                        "
                        >Sports Pool</span
                      >
                    </td>
                  </tr>
                </table>
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td style="padding-bottom: 8px">
                      <h1
                        style="
                          margin: 0;
                          font-family: 'Oswald', sans-serif;
                          font-weight: 800;
                          font-size: 26px;
                          letter-spacing: 0.02em;
                          text-transform: uppercase;
                          color: #171717;
                        "
                      >
                        Confirm your email
                      </h1>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-bottom: 24px">
                      <p
                        style="
                          margin: 0;
                          font-size: 15px;
                          line-height: 1.5;
                          color: #4b5563;
                        "
                      >
                        You signed up with
                        <strong style="color: #374151">{{ .Email }}</strong>.
                        Click the button below to verify your account and start
                        playing.
                      </p>
                    </td>
                  </tr>
                </table>
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td align="center" style="padding: 8px 0 24px 0">
                      <a
                        href="{{ .ConfirmationURL }}"
                        target="_blank"
                        rel="noopener noreferrer"
                        style="
                          display: inline-block;
                          background-color: #e11d48;
                          color: #ffffff;
                          font-family: 'Oswald', sans-serif;
                          font-weight: 700;
                          font-size: 14px;
                          letter-spacing: 0.08em;
                          text-transform: uppercase;
                          text-decoration: none;
                          padding: 14px 28px;
                          border-radius: 12px;
                          box-shadow: 0 6px 0 #9f1239,
                            0 10px 20px rgba(0, 0, 0, 0.3);
                        "
                        >Confirm email</a
                      >
                    </td>
                  </tr>
                </table>
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td
                      style="border-top: 1px solid #e5e7eb; padding-top: 20px"
                    >
                      <p
                        style="
                          margin: 0;
                          font-size: 12px;
                          line-height: 1.5;
                          color: #6b7280;
                        "
                      >
                        If the button doesn’t work, copy and paste this link
                        into your browser:
                      </p>
                      <p
                        style="
                          margin: 8px 0 0 0;
                          font-size: 12px;
                          line-height: 1.5;
                          word-break: break-all;
                        "
                      >
                        <a
                          href="{{ .ConfirmationURL }}"
                          style="color: #e11d48; text-decoration: underline"
                          >{{ .ConfirmationURL }}</a
                        >
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top: 24px">
                <p style="margin: 0; font-size: 12px; color: #6b7280">
                  Sports Pool – pick your games, win the pool.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
