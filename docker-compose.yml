name: sportspool

# ─────────────────────────────────────────────────────────────────────────────
# TWO MODES.
#
# DEFAULT — app only, against MANAGED SUPABASE. `docker compose up -d` brings up
# the Next.js app, the two schedulers and the tunnel, pointed at a hosted
# Supabase project via NEXT_PUBLIC_SUPABASE_URL / the keys in .env.docker.
# This is the recommended shape for production: Supabase keeps daily backups
# and sells point-in-time recovery as a switch, and patches Postgres and the
# auth service for you. The database here is a money ledger, and those two
# properties are worth more than the control given up.
#
# BUNDLED DATABASE — `docker compose --profile bundled-db up -d` additionally
# starts Postgres, GoTrue, PostgREST, Realtime and Kong on this host. Useful for
# local development and air-gapped installs. If you run it in production you own
# backups (RUNBOOK §2.1), CVE patching for Postgres and GoTrue, and keeping the
# database off the public internet. Do not choose it casually for real money.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  default:
    name: sportspool_default
  stackably:
    external: true

services:

  db:
    container_name: sp-db
    profiles: ["bundled-db"]
    image: public.ecr.aws/supabase/postgres:17.6.1.084
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  auth:
    container_name: sp-auth
    profiles: ["bundled-db"]
    image: public.ecr.aws/supabase/gotrue:v2.188.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}

  rest:
    container_name: sp-rest
    profiles: ["bundled-db"]
    image: public.ecr.aws/supabase/postgrest:v14.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  realtime:
    container_name: sp-realtime
    profiles: ["bundled-db"]
    image: public.ecr.aws/supabase/realtime:v2.78.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  kong:
    container_name: sp-kong
    profiles: ["bundled-db"]
    image: kong/kong:3.9.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ../.shared/kong/kong.yml:/home/kong/temp.yml:ro,z
      - ../.shared/kong/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    entrypoint: /home/kong/kong-entrypoint.sh
    networks:
      - default
      - stackably

  nextjs:
    container_name: sp-nextjs
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Deliberately no depends_on: in the default mode there is no Kong to wait
    # for, and Supabase is reached over the network at request time rather than
    # at container start. Under --profile bundled-db the app simply retries
    # during the few seconds the database stack takes to become healthy.
    env_file: .env.docker
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      timeout: 10s
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - default
      - stackably

  cloudflared:
    container_name: sp-cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      nextjs:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

  # ---------------------------------------------------------------------------
  # Settlement scheduler.
  #
  # WITHOUT THIS SERVICE, A SELF-HOSTED DEPLOYMENT NEVER PAYS ANYONE.
  #
  # Settlement is driven entirely by whoever calls /api/cron/settle. On Vercel
  # that is vercel.json's cron plus the GitHub Actions workflow. This compose
  # stack has neither, so pools would complete and then sit there holding the
  # players' entry money with no error raised anywhere.
  #
  # Calls the endpoint every 15 minutes. The route is idempotent by design, so
  # overlapping or repeated runs cannot pay a pool twice.
  #
  # Requires CRON_SECRET in .env.docker — the endpoint fails closed (503)
  # without it, so a missing secret means no settlement, not open settlement.
  settle-cron:
    container_name: sp-settle-cron
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      nextjs:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: >
      sh -c 'apk add --no-cache curl >/dev/null 2>&1;
      while true; do
        code=$$(curl -s -o /tmp/out -w "%{http_code}" --max-time 300
                 -H "Authorization: Bearer $$CRON_SECRET"
                 http://nextjs:3000/api/cron/settle);
        echo "[settle-cron] $$(date -Iseconds) HTTP $$code";
        if [ "$$code" != "200" ]; then echo "[settle-cron] FAILED: $$(cat /tmp/out)"; fi;
        sleep 900;
      done'
    networks:
      - default

  # ---------------------------------------------------------------------------
  # Payment reconciliation scheduler — the SECOND of the two jobs Vercel ran
  # from vercel.json (settle above is the first).
  #
  # Reconciliation cross-checks Stripe's records against the ledger and files
  # every mismatch into app_errors, and it is the only thing that purges
  # app_errors rows past retention. Without this service a self-hosted
  # deployment loses the layer that notices a paid session with no card, a
  # fabricated ledger row, or an untraceable payout — silently.
  #
  # Daily, matching the vercel.json schedule; the route's look-back window is
  # sized for a daily cadence (49h, so consecutive runs overlap rather than
  # leave gaps). The route is read-only apart from the retention purge, so an
  # extra run after a container restart is harmless.
  #
  # Until STRIPE_SECRET_KEY is provisioned the route skips the Stripe checks
  # and says so in its response — a missing key is a warning, not a nightly
  # false incident.
  reconcile-cron:
    container_name: sp-reconcile-cron
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      nextjs:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: >
      sh -c 'apk add --no-cache curl >/dev/null 2>&1;
      while true; do
        code=$$(curl -s -o /tmp/out -w "%{http_code}" --max-time 300
                 -H "Authorization: Bearer $$CRON_SECRET"
                 http://nextjs:3000/api/cron/reconcile);
        echo "[reconcile-cron] $$(date -Iseconds) HTTP $$code";
        if [ "$$code" != "200" ]; then echo "[reconcile-cron] FAILED: $$(cat /tmp/out)"; fi;
        sleep 86400;
      done'
    networks:
      - default
