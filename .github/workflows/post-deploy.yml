name: Post-deploy verification

# Runs the two suites that need a RUNNING deployment, against the deployment
# that just went live.
#
# WHY NOT IN ci.yml. Both suites are black-box: they need a URL serving real
# code, which does not exist at merge time. Booting the app inside CI would
# need real Supabase credentials in the runner, and would then be testing a
# local process rather than the thing users get. The failure this project
# actually suffered — five commits that merged green and never deployed — is
# precisely the class that only a post-deploy check catches.
#
# WHAT RUNS
#   test:e2e      HTTP smoke: security headers, the health contract, anonymous
#                 rejection on the money routes, CSRF, the 410 tombstones.
#   test:browser  Playwright: accessible naming, keyboard operability, the age
#                 gate, and every public page rendering without console errors.
#                 Desktop and mobile viewports.
#
# WHY PRODUCTION ONLY, AND NOT EVERY PREVIEW.
#
# Actions minutes, deliberately budgeted. This is a private repo on the
# 2,000-minute free allowance. settle-pools.yml already spends ~1,440 at its
# 30-minute cadence and alert.yml ~365, leaving roughly 195. A run here costs
# about 2 minutes with the caches warm, so production-only fits comfortably
# while running on every preview would not — a busy day of pull requests could
# exhaust the remaining allowance on its own and silently stop settlement,
# which is a far worse outcome than an unverified preview.
#
# To check a preview anyway, use the manual trigger and paste its URL.
#
# If this project moves off the free tier, widening the `if` below to include
# Preview is a one-line change.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment URL to verify (e.g. a Vercel preview URL)"
        required: true
        type: string

concurrency:
  # Keyed on the ENVIRONMENT, not the per-deployment URL. Every production
  # deploy verifies the same alias, so grouping by deployment id would give each
  # run its own group and cancel-in-progress would never fire — three deploys in
  # five minutes would pay for three full runs of an already-superseded check.
  group: post-deploy-${{ github.event.deployment_status.environment || inputs.url || 'manual' }}
  cancel-in-progress: true

jobs:
  verify:
    # deployment_status fires for every state; only a successful PRODUCTION
    # deployment is worth spending minutes on.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment, 'Production'))

    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      # NOT deployment_status.environment_url. That is the deployment-SPECIFIC
      # hostname (sports-pool-<hash>-<team>.vercel.app), which sits behind
      # Vercel Deployment Protection — it answered 302 to an auth redirect for
      # every request on the first run here, failing every assertion for a
      # reason that had nothing to do with the code.
      #
      # The production alias is what users actually resolve and is public, so
      # it is what deserves verifying. Same convention as settle-pools.yml: a
      # public URL, configured rather than hard-coded, and readable from a
      # repository variable as well as a secret because it is not a credential.
      #
      # NO HARD-CODED FALLBACK. It used to end in 'https://sports-pool.vercel.app'.
      # This repository is linked to TWO Vercel projects in two different
      # accounts, so a deployment_status event from either one would have been
      # verified against that single hard-coded host — passing on a deployment
      # that was never the one under test, and reporting a green post-deploy
      # check for a release nobody had actually looked at. Unset is caught by
      # the guard step below and fails loudly instead.
      E2E_BASE_URL: ${{ inputs.url || vars.APP_URL || secrets.APP_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile (node:22-alpine) and package.json engines.
          node-version: "22"
          cache: "npm"

      - name: Confirm a target URL was resolved
        run: |
          set -euo pipefail
          if [ -z "${E2E_BASE_URL:-}" ]; then
            echo "::error::No deployment URL available. Both suites SKIP without one, so this would be a green run that verified nothing. Set APP_URL (the production origin, e.g. https://www.playsportspool.com) under Settings > Secrets and variables > Actions, or pass a URL to the manual trigger."
            exit 1
          fi
          echo "Verifying ${E2E_BASE_URL}"
          echo "### Verifying \`${E2E_BASE_URL}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      # Deliberately NOT cached. actions/cache cannot SAVE on a
      # deployment_status event — "not supported because it's not tied to a
      # branch or tag ref" — so a cache step here warns on every run and never
      # populates anything. A warning in every log is noise that teaches people
      # to stop reading logs, which costs more than the download.
      #
      # Chromium is roughly a minute. At production-only cadence that is well
      # inside the remaining Actions allowance.
      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: HTTP smoke suite
        run: npm run test:e2e

      - name: Browser suite
        run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
