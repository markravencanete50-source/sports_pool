name: Post-deploy verification

# Runs the two suites that need a RUNNING deployment, against the deployment
# that just went live.
#
# WHY NOT IN ci.yml. Both suites are black-box: they need a URL serving real
# code, which does not exist at merge time. Booting the app inside CI would
# need real Supabase credentials in the runner, and would then be testing a
# local process rather than the thing users get. The failure this project
# actually suffered — five commits that merged green and never deployed — is
# precisely the class that only a post-deploy check catches.
#
# WHAT RUNS
#   test:e2e      HTTP smoke: security headers, the health contract, anonymous
#                 rejection on the money routes, CSRF, the 410 tombstones.
#   test:browser  Playwright: accessible naming, keyboard operability, the age
#                 gate, and every public page rendering without console errors.
#                 Desktop and mobile viewports.
#
# WHY PRODUCTION ONLY, AND NOT EVERY PREVIEW.
#
# Actions minutes, deliberately budgeted. This is a private repo on the
# 2,000-minute free allowance. settle-pools.yml already spends ~1,440 at its
# 30-minute cadence and alert.yml ~365, leaving roughly 195. A run here costs
# about 2 minutes with the caches warm, so production-only fits comfortably
# while running on every preview would not — a busy day of pull requests could
# exhaust the remaining allowance on its own and silently stop settlement,
# which is a far worse outcome than an unverified preview.
#
# To check a preview anyway, use the manual trigger and paste its URL.
#
# If this project moves off the free tier, widening the `if` below to include
# Preview is a one-line change.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment URL to verify (e.g. a Vercel preview URL)"
        required: true
        type: string

concurrency:
  # Rapid successive deploys should not stack up runs; only the newest
  # deployment is worth verifying.
  group: post-deploy-${{ github.event.deployment_status.environment_url || inputs.url }}
  cancel-in-progress: true

jobs:
  verify:
    # deployment_status fires for every state; only a successful PRODUCTION
    # deployment is worth spending minutes on.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment, 'Production'))

    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile (node:22-alpine) and package.json engines.
          node-version: "22"
          cache: "npm"

      - name: Confirm a target URL was resolved
        run: |
          set -euo pipefail
          if [ -z "${E2E_BASE_URL:-}" ]; then
            echo "::error::No deployment URL available. Both suites SKIP without one, so this would be a green run that verified nothing."
            exit 1
          fi
          echo "Verifying ${E2E_BASE_URL}"
          echo "### Verifying \`${E2E_BASE_URL}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      # The browser binaries are ~120MB and unchanged between runs; downloading
      # them every time would roughly double the cost of this workflow.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # Even with a cache hit the OS-level libraries are not persisted.
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: HTTP smoke suite
        run: npm run test:e2e

      - name: Browser suite
        run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
