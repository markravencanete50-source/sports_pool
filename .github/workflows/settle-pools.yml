name: Settle pools

# Pool settlement needs to run often on game days — a pool that finishes at 4pm
# should pay out in minutes, not the next morning.
#
# THIS WORKFLOW IS NOW A BACKSTOP, NOT THE PRIMARY SCHEDULER.
#
# It used to supply the frequent cadence, because Vercel Cron on the Hobby plan
# is day-granularity only. Production now deploys to the StackablyLTV team on
# PRO, so vercel.json carries the real `*/30 * * * *` settle schedule and Vercel
# runs it.
#
# The move happened because this workflow never actually delivered `*/30`.
# Measured across the last twelve scheduled runs, the gaps were 2.2h to 12.5h,
# mean 6.6h — roughly 3.6 runs a day against the 48 the schedule asks for.
# GitHub throttles scheduled workflows and guarantees no delivery time, which
# is fine for a catch-up job and useless for paying out minutes after a game.
#
# It is kept rather than deleted because /api/cron/settle is idempotent, so a
# second scheduler costs nothing and covers the case where a deployment breaks
# Vercel's crons. Do not rely on its timing.
#
# Running both is safe: /api/cron/settle is idempotent by design. Balance
# credits are guarded by a pre-check on user_transactions plus the UNIQUE index
# idx_user_transactions_winning_per_pool, so a pool cannot be paid twice no
# matter how many schedulers call it.
#
# SETUP — add BOTH of these under Settings > Secrets and variables > Actions:
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel
#   APP_URL      the production origin this should settle, with no trailing
#                slash, e.g. https://www.playsportspool.com
#
# APP_URL may be a repository *variable* instead of a secret — it is a public
# URL, not a credential — and the variable wins if both are set.
#
# APP_URL IS REQUIRED, AND DELIBERATELY HAS NO DEFAULT.
#
# It used to fall back to a hard-coded 'https://sports-pool.vercel.app'. A
# hard-coded host is safe only while exactly one deployment of this repository
# exists, and that stopped being true: the repo is linked to TWO Vercel projects
# in two different accounts, each backed by its OWN Supabase project.
#
# So the fallback did not name "production". It named one specific account's
# deployment. Forgetting the secret after a handover therefore would not stop
# settlement — it would keep settling against the wrong deployment and the
# wrong database, green the whole time, while the real production got nothing.
# A workflow that lies about which environment it acted on is worse than one
# that does not run.
#
# Requiring the value turns that silent mis-target into a visible skip.
#
# UNCONFIGURED vs BROKEN — these are deliberately different outcomes.
#
# Without CRON_SECRET this workflow used to fail on every run. Because it is
# scheduled every 30 minutes, that produced a permanent stream of failure
# emails, which trains everyone to ignore this workflow's email — the opposite
# of what a money-moving alarm should do.
#
# The distinction that matters: missing configuration does NOT mean settlement
# has stopped. The Vercel Cron in vercel.json still settles daily at 08:00 UTC,
# and /api/cron/settle fails closed on its own. It only means the faster cadence
# is inactive. So incomplete configuration SKIPS with a warning annotation,
# while a genuine settlement failure still fails the run loudly.

on:
  schedule:
    # Every 30 minutes. GitHub queues rather than guarantees this exact minute
    # under load, which settlement tolerates — it is a catch-up job, not a
    # real-time one.
    #
    # Not */15: this is a private repo, so every run bills a full Actions minute
    # even though the job takes seconds. */15 is ~2,880 min/month against a
    # 2,000-minute free allowance; */30 is ~1,440 and stays inside it.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  # Never let two settlement runs overlap.
  group: settle-pools
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configuration
        id: cfg
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: |
          set -euo pipefail

          missing=""
          if [ -z "${CRON_SECRET:-}" ]; then
            missing="CRON_SECRET"
          fi
          if [ -z "${APP_URL:-}" ]; then
            missing="${missing:+${missing} and }APP_URL"
          fi

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${missing} is not configured, so the 30-minute settlement cadence is INACTIVE. Settlement still runs once daily via Vercel Cron (vercel.json, 08:00 UTC). To enable the faster cadence, set CRON_SECRET (same value as on the Vercel project) and APP_URL (the production origin to settle) under Settings > Secrets and variables > Actions."
            echo "### Settlement skipped — ${missing} not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The 30-minute cadence is inactive. Vercel Cron still settles daily at 08:00 UTC." >> "$GITHUB_STEP_SUMMARY"
            echo "Set \`CRON_SECRET\` and \`APP_URL\` under **Settings > Secrets and variables > Actions** to enable it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Say WHICH deployment is about to be settled. With two Vercel
          # projects live on this repo, "settlement ran" is not a useful log
          # line unless it names the host it ran against.
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Settling against ${APP_URL}"
          echo "### Settling \`${APP_URL}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger settlement
        if: steps.cfg.outputs.configured == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: |
          set -euo pipefail

          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
                   --max-time 300 \
                   -H "Authorization: Bearer ${CRON_SECRET}" \
                   "${APP_URL}/api/cron/settle")

          echo "HTTP $code"
          cat "$body"
          echo

          if [ "$code" = "503" ]; then
            echo "::error::503 — CRON_SECRET is not configured on Vercel, so settlement is disabled."
            exit 1
          fi
          if [ "$code" = "401" ]; then
            echo "::error::401 — the CRON_SECRET Actions secret does not match CRON_SECRET on Vercel."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Settlement failed with HTTP $code"
            exit 1
          fi

          # A 200 carrying a non-JSON body (an edge/proxy error page, say) would
          # otherwise crash jq with a confusing parse error rather than saying
          # what went wrong.
          if ! jq -e . >/dev/null 2>&1 < "$body"; then
            echo "::error::Settlement returned HTTP 200 with a non-JSON body."
            exit 1
          fi

          # Surface held funds and per-pool failures as annotations so a silent
          # bad state cannot sit unnoticed in a green run.
          warnings=$(jq -r '.warnings // [] | length' < "$body")
          failures=$(jq -r '[.pools // [] | .[] | select(.error)] | length' < "$body")

          if [ "$warnings" != "0" ]; then
            jq -r '.warnings[]' < "$body" | while read -r w; do
              echo "::warning::$w"
            done
          fi
          if [ "$failures" != "0" ]; then
            jq -r '.pools[] | select(.error) | "pool \(.poolId): \(.error)"' < "$body" \
              | while read -r f; do echo "::error::$f"; done
            exit 1
          fi
