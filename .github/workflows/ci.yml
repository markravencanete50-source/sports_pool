name: CI

# Correctness gate for every push and pull request.
#
# WHAT BLOCKS A MERGE, AND WHY:
#   typecheck  — tsc --noEmit. Catches real breakage (bad shapes, dead symbols).
#   crons      — scripts/check-vercel-crons.ts. This project is on the Vercel
#                Hobby plan, where a sub-daily cron schedule does not degrade
#                gracefully: Vercel REFUSES TO CREATE THE DEPLOYMENT. That
#                already cost five undeployed commits — 7e0bf34 set settle to
#                hourly and every commit after it silently stopped building
#                while this workflow stayed green. A green gate over a stale
#                production is worse than no gate.
#   migrations — scripts/check-migrations.ts. Supabase keys applied migrations by
#                the numeric filename prefix, so two files sharing one prefix are
#                ONE migration to the ledger and the later file is silently
#                skipped. Three prefixes were duplicated here. Production was
#                not harmed — those changes had been applied by hand under other
#                names — but a FRESH provision would have come up missing three
#                migrations' worth of RPCs and grants, reporting success the
#                whole way. A migration you believe ran and did not is how a
#                missing grant reaches a money path.
#   test       — the unit suite plus scripts/verify-settlement.ts. The latter is
#                the money path: scoring, tie-breaks, and the cent-exact pot
#                split. It must never regress.
#   build      — next build. The last line of defence against a deploy-time
#                failure that only shows up on Vercel.
#   lint       — eslint, including 21 jsx-a11y rules at error severity. Blocking.
#   audit      — npm audit at high severity. Advisories were cleared by hand once
#                and nothing re-checked them; this keeps that honest.
#
# WHAT DELIBERATELY DOES NOT RUN HERE. The two black-box suites — tests/e2e
# (HTTP) and tests/browser (Playwright) — need a URL serving real code, which
# does not exist at merge time. They run in post-deploy.yml against the
# deployment that just went live. That split matters: the worst failure this
# project has had was five commits that merged green and never deployed at all,
# and only a post-deploy check can catch that.
#
# The build needs the NEXT_PUBLIC_* vars to exist, but never contacts Supabase or
# Stripe during a build, so deliberately fake placeholders are used here. No real
# secret is required to run CI, which keeps forks and PRs working.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile (node:22-alpine) and Next 16's requirement.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migration pipeline check
        run: npm run check:migrations

      - name: Vercel cron config check
        run: npm run check:crons

      - name: Unit + settlement regression tests
        run: npm run test

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com
          STRIPE_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
        run: npm run build

      - name: Lint
        run: npm run lint

      # Blocks on high/critical advisories only. Moderate and below are reported
      # but do not fail the run: a transitive moderate in a build-time-only
      # package should not be able to stop a payout fix from shipping.
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
