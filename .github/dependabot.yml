version: 2

# Keeps dependency advisories honest between audits.
#
# The first hardening cycle cleared every outstanding advisory by hand, but
# nothing re-checked them afterwards — so the clean state had a shelf life of
# exactly one audit. `npm audit --audit-level=high` in CI catches an advisory
# that lands in an existing dependency; Dependabot is what proposes the upgrade.
#
# Grouped deliberately. On a small team, twenty single-package PRs a week get
# ignored, which is the same as not having the tool. One grouped PR per
# ecosystem per week is reviewed.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

    # Held back deliberately, not neglected. Both were proposed on 13 August,
    # tested, and rejected because they DISABLE THE LINT GATE rather than merely
    # failing it — which would leave CI green over an unlinted codebase.
    #
    #   typescript >= 7  "typescript-eslint does not support TS 7.0"
    #   eslint     >= 10  breaks eslint-plugin-react inside eslint-config-next
    #
    # The repo runs TypeScript 6 and ESLint 9, which pass. Lift an entry here
    # once eslint-config-next ships support, and verify with `npm run check`
    # before merging — a passing typecheck alone does not prove lint still runs.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]

    groups:
      # Framework upgrades change build behaviour (this repo has already lost
      # two deploys to a Next minor), so they are reviewed on their own.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      # Anything touching money or auth gets its own PR so the diff is read.
      money-and-auth:
        patterns:
          - "stripe"
          - "@supabase/*"
      production:
        dependency-type: "production"
        exclude-patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
          - "stripe"
          - "@supabase/*"
      development:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
