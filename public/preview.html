<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportsPool — Launch Preview v2</title>
<!--
  SportsPool Launch Preview v2
  Rebuilt against the Developer Handoff spec after a 67-finding audit of v1.

  CONTRAST TABLE (brand-on-neutral, computed vs --brand-surface #060B16)
    --txt          #EAF1FC   16.9:1   AAA
    --mut          #8FA6CC    7.4:1   AAA
    --primary-tint (mix 55% white)  ~9.1:1  AAA   (replaces raw #7FA9E8)
    --accent-text  (mix 42% white)  ~6.2:1  AA    (raw --accent #D7263D is 3.97:1 — FAILS as text,
                                                   so it is used ONLY as a fill under white text)
    --ok           #2FBF71    8.5:1   AAA
    --warn         #F2C744   12.1:1   AAA
    --focus        #7FD3FF   11.3:1   AAA
  Tenant overrides must preserve a 4.5:1 floor for any *-text token.

  NO WEBFONT LINK: v1 loaded fonts.googleapis.com, which silently drops both typefaces
  offline or under a strict CSP. Full local fallback stacks are declared in Layer 1.
-->
<style>
/* ══════════ LAYER 1 · TENANT BRAND — the only block a white-label tenant edits ══════════ */
:root{
  --brand-primary:#0047AB;      --brand-primary-rgb:0 71 171;
  --brand-primary-deep:#002B6B;
  --brand-accent:#D7263D;       --brand-accent-rgb:215 38 61;
  --brand-surface:#060B16;      --brand-surface-2:#0A1224;
  --brand-font-display:"Barlow Condensed","Arial Narrow","Haettenschweiler",Impact,sans-serif;
  --brand-font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --brand-radius:16px;
}
/* TENANT DEMO — uncomment to re-theme the ENTIRE preview with no other edit.
   This is the acceptance test for Part 4 of the spec. v1 failed it. */
/* :root{--brand-primary:#7A1FA2;--brand-primary-rgb:122 31 162;--brand-primary-deep:#3D0B55;
        --brand-accent:#FF7A00;--brand-accent-rgb:255 122 0;} */

/* ══════════ LAYER 2 · DERIVED — never edited by tenants, never hand-typed elsewhere ══════════ */
:root{
  --primary:var(--brand-primary);
  --primary-deep:var(--brand-primary-deep);
  --primary-hover:color-mix(in oklab,var(--primary),white 12%);
  --primary-tint:color-mix(in oklab,var(--primary),white 55%);
  --primary-08:rgb(var(--brand-primary-rgb)/.08);
  --primary-12:rgb(var(--brand-primary-rgb)/.12);
  --primary-22:rgb(var(--brand-primary-rgb)/.22);
  --primary-50:rgb(var(--brand-primary-rgb)/.50);

  --accent:var(--brand-accent);
  --accent-hover:color-mix(in oklab,var(--accent),white 10%);
  --accent-text:color-mix(in oklab,var(--accent),white 42%);
  --accent-16:rgb(var(--brand-accent-rgb)/.16);
  --accent-40:rgb(var(--brand-accent-rgb)/.40);

  --ink:var(--brand-surface); --ink2:var(--brand-surface-2);
  --focus:#7FD3FF;
  --ok:#2FBF71; --ok-16:rgb(47 191 113/.16);
  --warn:#F2C744; --warn-16:rgb(242 199 68/.16);
  --txt:#EAF1FC; --mut:#8FA6CC;
  --line:rgb(157 184 232/.14); --glass:rgb(157 184 232/.06); --glass2:rgb(157 184 232/.10);

  --disp:var(--brand-font-display); --body:var(--brand-font-body);
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --r:var(--brand-radius);
  --gutter:28px; --nav-h:60px; --bottomnav-h:0px;
}
/* ══════════ LAYER 3 · NON-THEMEABLE LITERALS — explicitly out of tenant scope ══════════ */
:root{
  --ext-paypal:#003087; --ext-revolut:#191C1F; --ext-stripe:#635BFF;
  --field-turf-a:#0E5E33; --field-turf-b:#0A4426; --field-ball:#6B3F1D;
  --team-kc:#B3001B; --team-buf:#00338D;
}

/* ══════════ BASE ══════════ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
body{
  background:radial-gradient(1200px 600px at 80% -10%, var(--primary-22), transparent 60%),
             radial-gradient(900px 500px at -10% 30%, rgb(var(--brand-accent-rgb)/.10), transparent 55%),
             var(--ink);
  color:var(--txt);font-family:var(--body);font-size:14px;line-height:1.5;min-height:100vh;
  padding-bottom:var(--bottomnav-h);
}
::selection{background:var(--primary);color:#fff}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary-tint)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.btn-cob:focus-visible,.btn-red:focus-visible{outline-color:#fff}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--primary);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;text-decoration:none;transition:top .15s}
.skip:focus{top:8px}

/* ══════════ NAV ══════════ */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:10px var(--gutter);background:rgb(6 11 22/.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);min-height:var(--nav-h);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo-mark{flex:none;width:34px;height:34px;border-radius:9px;
  background:linear-gradient(145deg,var(--primary),var(--primary-deep));display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:17px;color:#fff;box-shadow:0 4px 14px var(--primary-50);position:relative}
.logo-mark::after{content:"";position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);border:2px solid var(--ink)}
.logo-word{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:.04em;color:var(--txt);white-space:nowrap}
.logo-word b{color:var(--accent-text);font-weight:700}
.tabs{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.tab{background:none;border:0;color:var(--mut);font-size:13.5px;font-weight:600;padding:10px 14px;
  border-radius:8px;transition:.15s;min-height:44px;border-bottom:2px solid transparent}
.tab[aria-current="page"]{color:#fff;background:var(--primary);border-bottom-color:#fff}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bal{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);
  border-radius:99px;padding:8px 14px 8px 10px;font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap}
.bal .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;
  background:linear-gradient(145deg,var(--primary),var(--primary-deep));display:grid;place-items:center;
  font-size:12px;font-weight:700;border:1px solid var(--line)}
.age-chip{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent-text);
  border:1px solid var(--accent-40);border-radius:5px;padding:4px 7px;white-space:nowrap}

/* role switcher (demo only) */
.roleswitch{display:flex;gap:2px;background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:2px}
.roleswitch button{background:none;border:0;color:var(--mut);font-size:11.5px;font-weight:700;
  padding:7px 10px;border-radius:6px;min-height:36px}
.roleswitch button[aria-pressed="true"]{background:var(--primary);color:#fff}

/* ══════════ LAYOUT ══════════ */
.wrap{max-width:1180px;margin:0 auto;padding:26px var(--gutter) 80px}
.view{display:none}
.view.on{display:block;animation:fade .25s ease}
.view:focus{outline:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px)}
h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:.03em;line-height:1.1}
h1{font-size:34px} h2.sec{font-size:24px;margin-bottom:4px} h3{font-size:19px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px;max-width:70ch}
.muted{color:var(--mut)}
.stack{display:flex;flex-direction:column;gap:16px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;border-radius:5px;padding:4px 8px;white-space:nowrap}
.pill.live{background:var(--accent-16);color:var(--accent-text);border:1px solid var(--accent-40)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pill.pub{background:var(--primary-22);color:var(--primary-tint);border:1px solid var(--primary-50)}
.pill.priv{background:var(--glass2);color:var(--mut);border:1px solid var(--line)}
.pill.boost{background:var(--warn-16);color:var(--warn);border:1px solid rgb(242 199 68/.4)}
.pill.ok{background:var(--ok-16);color:var(--ok);border:1px solid rgb(47 191 113/.4)}
.pill.warn{background:var(--warn-16);color:var(--warn);border:1px solid rgb(242 199 68/.4)}

/* buttons */
.btn{border:0;border-radius:10px;font-weight:600;font-size:13.5px;padding:13px 18px;transition:.15s;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-red{background:var(--accent);color:#fff}
.btn-cob{background:var(--primary);color:#fff}
.btn-ghost{background:var(--glass);border:1px solid var(--line);color:var(--txt)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.is-loading{pointer-events:none;position:relative;color:transparent}
.btn.is-loading::after{content:"";position:absolute;width:16px;height:16px;border:2px solid rgb(255 255 255/.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (hover:hover) and (pointer:fine){
  .btn-red:hover:not(:disabled){background:var(--accent-hover);box-shadow:0 4px 18px var(--accent-40)}
  .btn-cob:hover:not(:disabled){background:var(--primary-hover)}
  .btn-ghost:hover:not(:disabled){background:var(--glass2)}
  .tab:hover{color:var(--txt);background:var(--glass)}
  .pool:hover{transform:translateY(-3px);border-color:var(--primary-50);box-shadow:0 10px 30px rgb(0 20 55/.5)}
  .chip:hover{color:var(--txt)}
  .pick:hover:not(:disabled){border-color:var(--primary);color:var(--txt)}
  .provider:hover{background:var(--glass)}
}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label,.lg{font-size:12.5px;font-weight:600;color:var(--txt)}
.hint{font-size:11.5px;color:var(--mut)}
.inp{background:var(--ink2);border:1px solid var(--line);border-radius:10px;color:var(--txt);
  padding:12px 14px;font-size:14px;min-height:44px;width:100%}
.inp::placeholder{color:var(--mut)}
.inp:disabled{opacity:.5}
.err{color:var(--accent-text);font-size:12px;font-weight:600;display:flex;gap:6px;align-items:flex-start}
.err:empty{display:none}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
legend{font-size:12.5px;font-weight:700;padding:0 8px;color:var(--txt)}
.checkrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:13px;line-height:1.5}
.checkrow input[type=checkbox],.checkrow input[type=radio]{flex:none;width:20px;height:20px;margin-top:1px;accent-color:var(--primary)}
.dobgrid{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.seg{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content}
.seg button{background:none;border:0;color:var(--mut);font-weight:700;font-size:13px;padding:9px 16px;border-radius:7px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}

/* radio cards */
.radiocards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.radiocard{display:block;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;position:relative}
.radiocard:has(:checked){border-color:var(--primary);background:var(--primary-12)}
.radiocard .rc-t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.radiocard .rc-d{font-size:12px;color:var(--mut);margin-top:5px}
.radiocard .rc-sel{display:none;font-size:10px;font-weight:700;color:var(--primary-tint);letter-spacing:.08em}
.radiocard:has(:checked) .rc-sel{display:inline}

/* steps */
.steps{display:flex;gap:8px;list-style:none;margin-bottom:22px;flex-wrap:wrap;padding:0}
.steps li{font-size:12px;font-weight:700;color:var(--mut);padding:8px 14px;border-radius:99px;
  border:1px solid var(--line);background:var(--glass)}
.steps li[aria-current="step"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.steps li.done{color:var(--ok);border-color:rgb(47 191 113/.4)}
.steps li.done::before{content:"✓ "}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);
  padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{font-family:var(--mono)}
.tblwrap{overflow-x:auto}

/* empty state */
.empty{text-align:center;padding:34px 20px;color:var(--mut);font-size:13px;border:1px dashed var(--line);border-radius:12px}
.empty strong{display:block;color:var(--txt);font-family:var(--disp);font-size:17px;margin-bottom:6px}

/* banner */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;
  border:1px solid var(--line);background:var(--glass);font-size:13px;margin-bottom:18px;line-height:1.5}
.banner.good{border-color:rgb(47 191 113/.4);background:var(--ok-16)}
.banner.warnb{border-color:rgb(242 199 68/.4);background:var(--warn-16)}
.banner.bad{border-color:var(--accent-40);background:var(--accent-16)}
.banner .bi{flex:none;font-weight:700}

/* ══════════ FEATURED ══════════ */
.featured{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--primary-50);
  background:linear-gradient(120deg,var(--primary-deep) 0%,color-mix(in oklab,var(--primary-deep),black 25%) 45%,rgb(6 11 22/.6) 100%);
  padding:30px var(--gutter);margin-bottom:26px}
.featured::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 118px,rgb(255 255 255/.045) 118px 120px);pointer-events:none}
.featured::after{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,var(--accent-16),transparent 65%)}
.f-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative;z-index:1;flex-wrap:wrap}
.f-flag{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--warn)}
.featured h2{font-size:40px;line-height:1.02;position:relative;z-index:1}
.featured .f-meta{color:var(--mut);font-size:13.5px;margin:10px 0 20px;position:relative;z-index:1}
.f-stats{display:flex;gap:34px;position:relative;z-index:1;flex-wrap:wrap}
.f-stat .n{font-family:var(--disp);font-size:31px;font-weight:700;line-height:1}
.f-stat .n em{font-style:normal;color:var(--accent-text)}
.f-stat .l{font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.f-cta{position:relative;z-index:1;margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ══════════ MARKETPLACE ══════════ */
.filters{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.chip{background:var(--glass);border:1px solid var(--line);color:var(--mut);border-radius:99px;
  padding:11px 16px;font-size:12.5px;font-weight:600;min-height:44px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.chip[aria-pressed="true"]::before{content:"✓ "}
.chip[aria-disabled="true"]{color:var(--mut);opacity:.6;cursor:default}
.chip[aria-disabled="true"] span{font-size:9.5px;color:var(--warn);margin-left:4px}
.searchwrap{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
.pool{padding:18px 20px;transition:.18s;position:relative;display:block;text-decoration:none;color:inherit}
.pool.boosted{border-color:rgb(242 199 68/.4)}
.p-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.p-name{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:.02em}
.p-desc{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.p-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.p-pot .n{font-family:var(--disp);font-size:24px;font-weight:700;color:var(--primary-tint)}
.p-pot .l,.p-fee .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.p-fee{text-align:right}
.p-fee .n{font-family:var(--mono);font-size:14px;font-weight:600}
.p-foot{display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
  color:var(--mut);font-size:12px;flex-wrap:wrap}
.p-foot b{color:var(--txt);font-weight:600}

/* ══════════ POOL DETAIL ══════════ */
.detail-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.dh-meta{color:var(--mut);font-size:13px;margin-top:5px}
.dh-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
.fieldbox{padding:0;overflow:hidden}
.fp-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fp-head h3{font-size:17px;letter-spacing:.04em}
.fp-note{margin-left:auto;font-size:11px;color:var(--mut)}
.scorebug{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 22px;gap:10px}
.team{display:flex;align-items:center;gap:10px}
.team.right{justify-content:flex-end}
.tlogo{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:14px;color:#fff;border:2px solid rgb(255 255 255/.18)}
.tname{font-weight:700;font-size:15px}
.trec{font-size:11px;color:var(--mut)}
.tscore{font-family:var(--disp);font-size:34px;font-weight:700;min-width:44px;text-align:center}
.clockbox{text-align:center}
.clockbox .q{font-size:11px;color:var(--accent-text);font-weight:700;letter-spacing:.1em}
.clockbox .c{font-family:var(--mono);font-size:16px;font-weight:600}
.clockbox .dd{font-size:11px;color:var(--mut);margin-top:2px}
.poss{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);
  border:1px solid var(--ink);box-shadow:0 0 8px var(--warn);vertical-align:middle}
.fieldwrap{padding:6px 14px 16px}
.driveline{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;padding:10px 18px 0;
  flex-wrap:wrap;gap:10px}
.driveline b{color:var(--txt)}
.games{margin-top:18px}
.game{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--line);align-items:center}
.game:last-child{border-bottom:0}
.g-teams{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.g-at{color:var(--mut);font-weight:400;font-size:12px}
.g-time{font-size:11.5px;color:var(--mut);margin-top:3px}
.g-time.islive{color:var(--accent-text);font-weight:600}
.picks{display:flex;gap:8px}
.pick{width:52px;height:48px;border-radius:9px;background:var(--glass);border:1px solid var(--line);
  color:var(--mut);font-weight:700;font-size:13px;transition:.12s}
.pick[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:#fff;
  box-shadow:0 3px 12px var(--primary-50)}
.pick[aria-checked="true"]::after{content:" ✓"}
.pick:disabled{opacity:.35;cursor:not-allowed}
.pick:disabled:hover{border-color:var(--line);color:var(--mut)}

/* slip */
.slip{position:sticky;top:calc(var(--nav-h) + 16px)}
.slip-in{padding:18px 20px}
.slip h2{font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cardsleft{margin-left:auto;font-size:11px;color:var(--mut);font-weight:500;font-family:var(--body)}
.slip-picks{margin:14px 0;display:flex;flex-direction:column;gap:8px;max-height:190px;overflow:auto;
  overscroll-behavior:contain}
.sp-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;background:var(--glass);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.sp-row b{color:var(--primary-tint)}
.slip-total{display:flex;justify-content:space-between;font-size:13px;padding:12px 0;border-top:1px solid var(--line)}
.slip-total b{font-family:var(--mono);font-size:15px}
.priv-note{display:flex;gap:8px;font-size:11.5px;color:var(--mut);margin-top:12px;line-height:1.45}
.priv-note .lock{color:var(--warn)}
.mc-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:8px 0;
  border-bottom:1px dashed var(--line)}
.mc-row:last-of-type{border-bottom:0}
.ok{color:var(--ok);font-weight:600}
.bad{color:var(--accent-text);font-weight:600}
.pend{color:var(--mut)}

/* chat */
.chat{margin-top:18px}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.slowmode{margin-left:auto;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.msgs{padding:14px 18px;display:flex;flex-direction:column;gap:12px;max-height:230px;overflow:auto;
  overscroll-behavior:contain}
.msg{display:flex;gap:10px;font-size:13px}
.msg .who{font-weight:700;color:var(--primary-tint)}
.msg .mod{color:var(--warn);font-size:10px;font-weight:700;border:1px solid rgb(242 199 68/.4);
  border-radius:4px;padding:1px 5px;margin-left:6px}
.msg .when{color:var(--mut);font-size:11px;margin-left:6px}
.msg.sys{color:var(--mut);font-size:12px;font-style:italic}
.msg.removed{color:var(--mut);font-style:italic;font-size:12px;border-left:2px solid var(--line);padding-left:10px}
.chat-in{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.chat-in .inp{flex:1;min-width:160px}
.cooldown{font-family:var(--mono);font-size:12px;color:var(--warn);align-self:center;min-width:34px;text-align:center}

/* my cards */
.mycards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.mc{padding:18px 20px}
.mc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.mc-head h3{font-size:18px}
.mc-sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.mc-score{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mc-score .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.mc-score .n{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--primary-tint)}
.mc-score .n.win{color:var(--ok)}

/* wallet */
.wallet-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:18px;align-items:start}
.wbal{padding:24px;background:linear-gradient(135deg,var(--primary-deep),color-mix(in oklab,var(--primary-deep),black 20%));
  border-color:var(--primary-50)}
.wbal .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary-tint)}
.wbal .n{font-family:var(--disp);font-size:40px;font-weight:700;margin:4px 0 2px}
.balmath{margin:14px 0;padding-top:12px;border-top:1px solid rgb(255 255 255/.14)}
.balmath .r{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0}
.balmath .r.tot{font-weight:700;border-top:1px solid rgb(255 255 255/.14);margin-top:6px;padding-top:10px}
.balmath .num{font-family:var(--mono)}
.wsec{padding:20px 22px;margin-bottom:16px}
.wsec h3{margin-bottom:12px}
.providers{border:0;padding:0;margin:0 0 14px}
.providers legend{padding:0;margin-bottom:10px}
.provider{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:10px;cursor:pointer}
.provider:has(:checked){border-color:var(--primary);background:var(--primary-12)}
.provider input{flex:none;width:20px;height:20px;accent-color:var(--primary)}
.pv-ic{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  font-weight:700;font-size:12px;color:#fff}
.pv-paypal{background:var(--ext-paypal)} .pv-revolut{background:var(--ext-revolut)}
.pv-name{font-weight:600;font-size:13.5px}
.pv-sub{font-size:11.5px;color:var(--mut)}
.pv-badge{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--primary-tint);display:none}
.provider:has(:checked) .pv-badge{display:block}
.tx{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:11px 0;
  border-bottom:1px dashed var(--line);align-items:center;flex-wrap:wrap}
.tx:last-child{border-bottom:0}
.tx .amt.in{color:var(--ok);font-family:var(--mono)}
.tx .amt.out{color:var(--accent-text);font-family:var(--mono)}
.st{font-size:10.5px;padding:3px 7px;border-radius:5px}
.st.paid{background:var(--ok-16);color:var(--ok)}
.st.rev{background:var(--warn-16);color:var(--warn)}

/* dialogs */
dialog{width:min(480px,94vw);background:linear-gradient(160deg,color-mix(in oklab,var(--ink2),white 4%),var(--ink2));
  border:1px solid var(--line);border-radius:18px;padding:0;color:var(--txt);max-height:90vh}
dialog::backdrop{background:rgb(3 6 13/.72);backdrop-filter:blur(6px)}
.dlg-head{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 0}
.dlg-head h2{font-size:22px;flex:1}
.dlg-close{background:var(--glass);border:1px solid var(--line);color:var(--txt);border-radius:8px;
  width:36px;height:36px;flex:none;font-size:16px;line-height:1}
.dlg-body{padding:12px 24px 22px}
.m-sub{color:var(--mut);font-size:13px;margin-bottom:18px;line-height:1.5}
.m-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.share-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.share-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;
  border:1px solid var(--line);border-radius:12px;background:var(--glass);color:var(--txt);
  font-size:12px;font-weight:600;min-height:44px;text-decoration:none}
.qr-wrap{display:flex;gap:16px;align-items:center;background:var(--glass);border:1px solid var(--line);
  border-radius:12px;padding:14px;flex-wrap:wrap}
.qtxt{font-size:12px;color:var(--mut);line-height:1.5;flex:1;min-width:160px}
.linkrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.linkrow .inp{flex:1;font-family:var(--mono);font-size:11.5px;min-width:160px}
.agree-list{margin:0 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.agree-list li{display:flex;gap:10px;font-size:13px;line-height:1.45}
.agree-list li::before{content:"—";color:var(--accent-text);font-weight:700}

/* signup */
.authwrap{max-width:520px;margin:0 auto;padding:40px var(--gutter) 80px}
.ag-badge{width:64px;height:64px;border-radius:50%;border:3px solid var(--accent);display:grid;
  place-items:center;margin:0 auto 16px;font-family:var(--disp);font-size:24px;font-weight:700;color:var(--accent-text)}
.agecheck{font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:8px;background:var(--glass);
  border:1px solid var(--line);margin-top:10px}
.agecheck.good{color:var(--ok);border-color:rgb(47 191 113/.4)}
.agecheck.bad{color:var(--accent-text);border-color:var(--accent-40)}

/* demo panel */
.demo{position:fixed;right:14px;bottom:calc(14px + var(--bottomnav-h));z-index:80;width:min(280px,88vw)}
.demo summary{list-style:none;cursor:pointer;background:var(--primary);color:#fff;border-radius:10px;
  padding:11px 16px;font-size:12px;font-weight:700;box-shadow:0 6px 20px rgb(0 20 55/.5);min-height:44px;
  display:flex;align-items:center;gap:8px}
.demo summary::-webkit-details-marker{display:none}
.demo-body{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:14px;
  margin-top:8px;max-height:60vh;overflow:auto}
.demo-body .lg{display:block;margin:12px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.demo-body .lg:first-child{margin-top:0}
.demo-body select,.demo-body button{width:100%;font-size:12px}
.demo-body button{background:var(--glass);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:9px;margin-top:6px;min-height:40px}

/* bottom nav (mobile) */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:rgb(6 11 22/.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bottomnav ul{display:flex;list-style:none;margin:0;padding:0}
.bottomnav li{flex:1}
.bottomnav button{width:100%;background:none;border:0;color:var(--mut);font-size:10px;font-weight:600;
  padding:8px 2px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-top:2px solid transparent}
.bottomnav button[aria-current="page"]{color:#fff;border-top-color:var(--primary);background:var(--primary-12)}
.bottomnav .bn-ic{font-size:17px;line-height:1}

footer{border-top:1px solid var(--line);padding:22px var(--gutter);color:var(--mut);font-size:11.5px;
  display:flex;gap:18px;flex-wrap:wrap;align-items:center}
footer .f21{color:var(--accent-text);font-weight:700;border:1px solid var(--accent-40);border-radius:5px;padding:3px 7px}
#toast{position:fixed;bottom:calc(24px + var(--bottomnav-h));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--primary);color:#fff;font-size:13px;font-weight:600;padding:12px 20px;border-radius:99px;
  opacity:0;transition:.25s;z-index:200;box-shadow:0 8px 24px rgb(0 30 80/.5);pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════ RESPONSIVE — two breakpoints only (768 / 1024) ══════════ */
@media(max-width:1024px){
  .cols{grid-template-columns:1fr}
  .wallet-grid{grid-template-columns:1fr}
  .slip{position:static}
}
@media(max-width:768px){
  :root{--gutter:16px;--bottomnav-h:64px}
  .tabs{display:none}
  .bottomnav{display:block}
  .featured h2{font-size:30px}
  h1{font-size:27px}
  .radiocards{grid-template-columns:1fr}
  .searchwrap{margin-left:0;width:100%}
  .searchwrap .inp{width:100%}
  .slip-picks,.msgs{max-height:none}
  .m-actions{flex-direction:column-reverse}
  .m-actions .btn{width:100%}
  .roleswitch{order:3}
  .demo{display:none}
}
@media(max-width:560px){
  .scorebug{grid-template-columns:1fr;gap:14px;text-align:center}
  .team,.team.right{justify-content:center}
  .dobgrid{grid-template-columns:1fr}
  .share-opts{grid-template-columns:1fr}
}
@media(max-width:480px){ .logo-word{display:none} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
  html{scroll-behavior:auto}
  .pill.live::before{animation:none}
}
@media (forced-colors:active){
  .pill,.chip,.btn,.card{border:1px solid CanvasText}
}
</style>
</head>
